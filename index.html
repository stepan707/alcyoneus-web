<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alcyoneus Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Exo+2:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #e0e0e0;
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
        }
        .sci-fi-font { font-family: 'Orbitron', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
        }
        .gold { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .silver { color: #c0c0c0; text-shadow: 0 0 10px rgba(192, 192, 192, 0.5); }
        .bronze { color: #cd7f32; text-shadow: 0 0 10px rgba(205, 127, 50, 0.5); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-12">
            <h1 class="sci-fi-font text-4xl md:text-6xl font-bold tracking-widest uppercase mb-2 bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">
                Alcyoneus
            </h1>
            <p class="sci-fi-font text-xl text-blue-300 opacity-80 italic">Galactic Hall of Fame</p>
        </header>

        <div id="podium" class="flex flex-col md:flex-row items-end justify-center gap-4 mb-12 min-h-[200px]">
            <p class="text-center w-full opacity-50 animate-pulse">Establishing uplink to Supabase...</p>
        </div>

        <div id="error-msg" class="hidden bg-red-900/50 border border-red-500 text-red-200 p-4 rounded mb-8 text-center break-words"></div>

        <div class="glass overflow-hidden">
            <table class="w-full text-left border-collapse text-sm md:text-base">
                <thead class="bg-white/10 sci-fi-font text-blue-300">
                    <tr>
                        <th class="p-4">#</th>
                        <th class="p-4">Pilot</th>
                        <th class="p-4 text-right">Score</th>
                        <th class="p-4 text-right hidden md:table-cell">Date</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                </tbody>
            </table>
        </div>

        <footer class="text-center mt-12 opacity-50 text-sm">
            <p>&copy; 2025 Alcyoneus Project</p>
        </footer>
    </div>

    <script>
        const SUPABASE_URL = 'https://kszubcxejomdsmoahnxc.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtzenViY3hlam9tZHNtb2FobnhjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg3MjIzMTQsImV4cCI6MjA3NDI5ODMxNH0.CJ5pod2xEpMurg9EY6qhP-O-gFl7rK1UJJX337-w99M';
        
        async function fetchLeaderboard() {
            const errorMsgEl = document.getElementById('error-msg');
            
            try {
                const url = `${SUPABASE_URL}/rest/v1/high_scores?select=score,played_at,profiles(username)&order=score.desc&limit=20`;
                
                const response = await fetch(url, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': `Bearer ${SUPABASE_KEY}`
                    }
                });

                if (!response.ok) {
                    // Zkusíme přečíst detail chyby ze serveru
                    const errorText = await response.text();
                    throw new Error(`Server Error ${response.status}: ${errorText}`);
                }

                const data = await response.json();

                const cleanData = data.map(item => ({
                    username: item.profiles ? item.profiles.username : 'Unknown Pilot',
                    score: item.score,
                    date: item.played_at
                }));

                renderLeaderboard(cleanData);
                errorMsgEl.classList.add('hidden');

            } catch (error) {
                console.error('Fetch error:', error);
                const podiumEl = document.getElementById('podium');
                
                // Pokud je podium prázdné nebo se načítá, zobrazíme chybu
                if (podiumEl.innerText.includes("uplink")) {
                    podiumEl.innerHTML = '';
                    // Vypíšeme PŘESNOU chybu
                    errorMsgEl.textContent = `Connection Failed: ${error.message}`;
                    errorMsgEl.classList.remove('hidden');
                }
            }
        }

        // --- VYKRESLENÍ ---
        function renderLeaderboard(players) {
            const podiumEl = document.getElementById('podium');
            const bodyEl = document.getElementById('leaderboard-body');
            
            podiumEl.innerHTML = '';
            bodyEl.innerHTML = '';

            if (players.length === 0) {
                podiumEl.innerHTML = '<p class="text-center w-full sci-fi-font text-xl">No data found in this sector.</p>';
                return;
            }

            const top3 = players.slice(0, 3);
            const podiumOrder = [];
            if (top3[1]) podiumOrder.push(1);
            if (top3[0]) podiumOrder.push(0);
            if (top3[2]) podiumOrder.push(2);

            podiumOrder.forEach(index => {
                const player = top3[index];
                const isFirst = index === 0;
                const height = isFirst ? 'h-48' : (index === 1 ? 'h-36' : 'h-32');
                const colorClass = index === 0 ? 'gold' : (index === 1 ? 'silver' : 'bronze');
                const title = index === 0 ? '1st' : (index === 1 ? '2nd' : '3rd');
                const barColor = index === 0 ? 'bg-yellow-400' : (index === 1 ? 'bg-gray-400' : 'bg-orange-400');

                podiumEl.innerHTML += `
                    <div class="flex flex-col items-center w-1/3 min-w-[100px] transition-transform hover:scale-105 duration-300">
                        <div class="sci-fi-font font-bold text-xl md:text-2xl ${colorClass} mb-1 text-center truncate w-full">${escapeHTML(player.username)}</div>
                        <div class="text-blue-200 mb-2 font-mono text-sm md:text-base">${player.score.toLocaleString()}</div>
                        <div class="glass w-full ${height} flex items-center justify-center flex-col border-b-0 rounded-b-none relative group overflow-hidden">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                            <span class="sci-fi-font text-3xl opacity-30 group-hover:opacity-100 transition-opacity z-10">${title}</span>
                            <div class="absolute bottom-0 w-full h-1 ${barColor} shadow-[0_0_10px_currentColor]"></div>
                        </div>
                    </div>
                `;
            });

            const rest = players.slice(3);
            rest.forEach((player, i) => {
                const date = new Date(player.date).toLocaleDateString('en-GB');
                bodyEl.innerHTML += `
                    <tr class="border-t border-white/5 hover:bg-white/10 transition-colors duration-200">
                        <td class="p-4 opacity-50 font-mono w-12 text-center">${i + 4}.</td>
                        <td class="p-4 font-semibold text-blue-100">${escapeHTML(player.username)}</td>
                        <td class="p-4 text-right text-blue-400 font-mono font-bold tracking-wider">${player.score.toLocaleString()}</td>
                        <td class="p-4 text-right hidden md:table-cell opacity-50 text-xs font-mono">${date}</td>
                    </tr>
                `;
            });
        }

        fetchLeaderboard();
        setInterval(fetchLeaderboard, 30000);

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(tag) {
                const charsToReplace = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                };
            return charsToReplace[tag] || tag;
        });
        
    </script>
</body>
</html>
